# ============================================================================
# שערי האיכות (FOUNDATION §3.7, §3.8). אדום = לא ממזגים. אין "נמזג ונתקן אחר כך".
# ============================================================================
name: ci

on:
  push:
    branches: [main, house]
  pull_request:

env:
  NEXT_PUBLIC_SITE_URL: https://dmorgen.com
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  gates:
    name: typecheck, rooms, build, budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run budget
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1

  lighthouse:
    name: lighthouse mobile (perf 90+, a11y 100)
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx --yes @lhci/cli@0.14.0 autorun
